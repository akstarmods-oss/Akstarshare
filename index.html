<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akash - Sila Live Screen Mirror</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #58a6ff;
            font-size: 22px;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .badge-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .badge {
            background: #1f242c;
            border: 1px solid #30363d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #8b949e;
        }

        #status {
            font-size: 14px;
            color: #d29922;
            transition: color 0.3s ease;
        }

        .video-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 75vh;
            background: #000000;
            border: 2px solid #30363d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .placeholder-text {
            position: absolute;
            color: #484f58;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #30363d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AK STAR LIVE MIRROR</h1>
        <div class="badge-container">
            <span class="badge">Broadcaster: Sila</span>
            <span class="badge">Viewer: Akash</span>
        </div>
        <div id="status">Connecting to signaling server...</div>
    </div>

    <div class="video-box">
        <div id="placeholder" class="placeholder-text">Waiting for Sila to start screen sharing...</div>
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <div class="controls">
        <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="btn" onclick="reconnect()">Reconnect</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');
        const placeholder = document.getElementById('placeholder');

        // Yahan apna Termux IP (jaise ws://192.168.1.15:8080) ya Cloud WebSocket URL daalein
        const SERVER_URL = "ws://YOUR_SERVER_IP:8080";

        let ws;
        let pc;

        function connectSignaling() {
            statusEl.innerText = "Connecting to signaling server...";
            statusEl.style.color = "#d29922";

            ws = new WebSocket(SERVER_URL);

            ws.onopen = () => {
                statusEl.innerText = "Connected to server. Ready for Sila's screen!";
                statusEl.style.color = "#58a6ff";

                // Server ko announce karein ki viewer 'akash' connect hua hai
                ws.send(JSON.stringify({
                    type: 'register',
                    name: 'akash'
                }));

                initPeerConnection();
            };

            ws.onmessage = async (msg) => {
                try {
                    const data = JSON.parse(msg.data);

                    if (data.type === 'offer') {
                        statusEl.innerText = "Receiving live stream from Sila...";
                        statusEl.style.color = "#2ea043";

                        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);

                        ws.send(JSON.stringify({
                            type: 'answer',
                            answer: answer
                        }));
                    } else if (data.type === 'candidate' && pc) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                        } catch (e) {
                            console.error("ICE error:", e);
                        }
                    } else if (data.type === 'stream_stopped') {
                        statusEl.innerText = "Sila has stopped sharing screen.";
                        statusEl.style.color = "#f85149";
                        remoteVideo.srcObject = null;
                        placeholder.style.display = "block";
                    }
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            };

            ws.onerror = () => {
                statusEl.innerText = "Server connection failed! Check IP/Port.";
                statusEl.style.color = "#f85149";
            };

            ws.onclose = () => {
                statusEl.innerText = "Disconnected from server. Retrying in 4s...";
                statusEl.style.color = "#f85149";
                setTimeout(connectSignaling, 4000);
            };
        }

        function initPeerConnection() {
            if (pc) {
                pc.close();
            }

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });

            pc.ontrack = (event) => {
                statusEl.innerText = "🔴 LIVE: Viewing Sila's Screen";
                statusEl.style.color = "#2ea043";
                placeholder.style.display = "none";
                remoteVideo.srcObject = event.streams[0];
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'candidate',
                        candidate: event.candidate
                    }));
                }
            };
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                remoteVideo.requestFullscreen().catch(err => alert("Fullscreen error"));
            } else {
                document.exitFullscreen();
            }
        }

        function reconnect() {
            if (ws) ws.close();
            connectSignaling();
        }

        // Auto start on page load
        connectSignaling();
    </script>
</body>
</html>
